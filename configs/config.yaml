# WattBot2025 Configuration

models:
  llm:
    primary: "claude-3-5-sonnet-20241022"
    temperature: 0.1
    provider: "anthropic"

  embedding:
    model: "BAAI/bge-large-en-v1.5"
    dimension: 1024

retrieval:
  chunk_size: 1200
  chunk_overlap: 200
  top_k: 8
  bm25:
    k1: 1.2
    b: 0.75
  vector_search:
    metric: "cosine"
    # "hnsw" for approximate search, "exact" for the full numpy scan
    backend: "hnsw"
    hnsw:
      M: 16
      ef_construction: 200
      ef_search: 100
      index_dir: "./data/cache/hnsw"

paths:
  data_dir: "./data/raw"
  cache_dir: "./data/cache"
  processed_dir: "./data/processed"
  chunks_dir: "./data/chunks"
  index_path: "./data/processed/vector_index.pkl"

evaluation:
  metrics: ["accuracy", "f1", "exact_match"]
